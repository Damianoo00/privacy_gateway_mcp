name: privacy-gateway

services:
  gateway:
    build:
      context: .
    image: ${PG_IMAGE:-privacy-gateway:local}
    user: "1000:1000"
    env_file:
      - ${PG_BACKEND_ENV_FILE:-./backend-secrets.example.env}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${PG_PORT:-8000}:8000"
    networks: [local]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - private_data:/data
      - ${PG_SOURCES:-source_data}:/sources
      - ${PG_WORKSPACE:-work_data}:/workspace
      - type: bind
        source: ${PG_CONFIG:-./config.container.example.toml}
        target: /etc/gateway/config.toml
        read_only: true
        bind:
          create_host_path: false
    command: ["serve", "--config", "/etc/gateway/config.toml", "--key-file", "/data/gateway.key", "--host", "0.0.0.0", "--allow-non-loopback", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  local:
    driver: bridge

volumes:
  private_data:
  source_data:
  work_data:
