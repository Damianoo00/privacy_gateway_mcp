name: privacy-gateway

networks:
  local:
    internal: true

volumes:
  private_data:

x-common: &common
  image: ${PG_IMAGE:-privacy-gateway:local}
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 2g
  cpus: 1
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks: [local]
  volumes:
    - private_data:/data

x-http: &http
  <<: *common
  init: true
  restart: unless-stopped
  stop_grace_period: 15s
  ports:
    - "127.0.0.1:${PG_PORT:-8000}:8000"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  bootstrap:
    <<: *common
    profiles: [setup]
    command: ["init-key", "/data/gateway.key"]

  gateway:
    <<: *http
    volumes:
      - private_data:/data
      - type: bind
        source: ${PG_SOURCES:-./sources}
        target: /sources
      - type: bind
        source: ${PG_CONFIG:-./config.container.json}
        target: /etc/gateway/config.json
        read_only: true
    command: ["serve", "--config", "/etc/gateway/config.json", "--key-file", "/data/gateway.key", "--host", "0.0.0.0", "--allow-non-loopback", "--port", "8000"]
