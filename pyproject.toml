[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway-mcp"
version = "0.1.0"
description = "Local privacy gateway for MCP"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp>=1.12,<2", "presidio-analyzer>=2.2,<3", "cryptography>=44,<47"]

[project.optional-dependencies]
documents = ["python-docx>=1.1,<2", "pypdf>=5,<7", "openpyxl>=3.1,<4"]

[project.scripts]
privacy-gateway = "privacy_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["privacy_gateway*"]
